<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Practicals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- Sidebar (becomes a slide-in drawer on mobile) -->
  <aside id="sidebar" class="sidebar" aria-label="Main navigation">
    <div class="brand"><span class="brand-icon"><i class="bi bi-cpu"></i></span> My Practicals</div>
    <nav class="nav flex-column gap-1">
      <button class="nav-item-btn" data-action="nav" data-view="dashboard"><i class="bi bi-grid-1x2"></i> Dashboard</button>
      <button class="nav-item-btn" data-action="nav" data-view="library" data-filter="all"><i class="bi bi-collection"></i> All Practicals</button>
      <button class="nav-item-btn" data-action="nav" data-view="library" data-filter="fav"><i class="bi bi-star"></i> Favorites</button>
      <button class="nav-item-btn" data-action="nav" data-view="settings"><i class="bi bi-gear"></i> Settings</button>
    </nav>
    <div class="side-foot"><i class="bi bi-mortarboard"></i> Built for AI Lab Practice</div>
  </aside>
  <div id="backdrop" class="backdrop" data-action="menu"></div>

  <div class="main-wrap">
    <!-- Top navigation bar -->
    <header class="topbar">
      <button class="icon-btn d-lg-none" data-action="menu" aria-label="Open menu"><i class="bi bi-list"></i></button>
      <div class="page-head">
        <nav aria-label="breadcrumb" id="crumbs"></nav>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="search" type="search" class="form-control" placeholder="Search by PR No., title or content..." aria-label="Search practicals" autocomplete="off">
      </div>
      <button class="icon-btn" data-action="theme" id="themeBtn" aria-label="Toggle light/dark mode"><i class="bi bi-moon"></i></button>
      <button class="btn btn-accent" data-action="add"><i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline">Add Practical</span></button>
    </header>
    <!-- Page content is rendered here by script.js -->
    <main id="app" class="content"></main>
  </div>

  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div id="toast" class="toast-box" role="status" aria-live="polite"></div>

  <!-- Confirmation dialog -->
  <div id="modal" class="modal-wrap d-none" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <h2 id="modalTitle" class="h5"></h2>
      <p id="modalMsg" class="muted"></p>
      <div class="d-flex gap-2 justify-content-end">
        <button class="btn btn-soft" data-action="no" id="modalNo">Cancel</button>
        <button class="btn btn-danger" data-action="yes" id="modalYes">Confirm</button>
      </div>
    </div>
  </div>
  <script src="practicals.js"></script>
  <script src="app.js"></script>
</body>
</html>
